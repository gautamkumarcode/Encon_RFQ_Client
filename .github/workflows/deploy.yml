name: 🚀 Deploy Frontend to AWS EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Create deployment archive
      - name: Create deployment archive
        run: |
          git archive --format=tar.gz HEAD -o deploy.tar.gz

      # Upload bundle to EC2
      - name: Upload frontend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true

      # Deploy application
      - name: Deploy & Restart Frontend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            echo "🚀 Starting frontend deployment..."

            cd ${{ secrets.APP_DIR }}

            echo "📦 Extracting application..."
            rm -rf .next
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            echo "🔐 Creating environment variables..."

            cat > .env.local << 'EOF'
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '/api' }}
            BACKEND_URL=${{ secrets.BACKEND_URL || 'http://localhost:5000' }}
            EOF

            echo "📥 Installing dependencies..."
            npm ci

            echo "🏗️ Building Next.js application..."
            npm run build

            echo "🚀 Starting/restarting PM2..."

            pm2 describe frontend > /dev/null 2>&1 \
              && pm2 restart frontend \
              || pm2 start npm --name frontend -- start

            pm2 save

            echo "✅ Frontend deployment completed!"

            pm2 status