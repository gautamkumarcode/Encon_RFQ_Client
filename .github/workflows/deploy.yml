name: 🚀 Deploy Frontend to AWS EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 🧩 Create clean deployment archive (NO node_modules)
      - name: Create deployment archive
        run: git archive --format=tar.gz HEAD -o deploy.tar.gz

      # 📤 Upload bundle to AWS EC2
      - name: Upload frontend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true
          rm: false

      # 🚀 Extract archive, write .env.local, build Next.js & restart PM2
      - name: Deploy & Restart Frontend PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Create/update .env.local file with GitHub secrets
            cat > .env.local << 'EOF'
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '/api' }}
            BACKEND_URL=${{ secrets.BACKEND_URL || 'http://localhost:5000' }}
            EOF

            npm install --production
            npm run build
            pm2 restart frontend || pm2 start "npm start" --name frontend
            pm2 save
