name: 🚀 Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Create environment file BEFORE build
      - name: Create .env.local
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          RAW_API_URL="${NEXT_PUBLIC_API_URL}"
          RAW_BACKEND_URL="${BACKEND_URL}"
          API_URL="${RAW_API_URL:-/api}"
          B_URL="${RAW_BACKEND_URL:-http://localhost:5000}"
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=${API_URL}
          BACKEND_URL=${B_URL}
          EOF

      # Install and build on GitHub Actions
      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      # Create deployment package
      - name: Create deployment archive
        run: |
          mkdir deploy

          cp -r .next deploy/
          cp -r public deploy/
          cp package.json deploy/
          cp package-lock.json deploy/

          if [ -f next.config.js ]; then
            cp next.config.js deploy/
          fi

          if [ -f next.config.ts ]; then
            cp next.config.ts deploy/
          fi

          cp .env.local deploy/

          cd deploy
          tar -czf ../frontend.tar.gz .

      # Upload to EC2
      - name: Upload frontend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true

      # Deploy
      - name: Deploy & Restart Frontend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            echo "📦 Extracting deployment..."
            tar -xzf frontend.tar.gz
            rm frontend.tar.gz

            echo "🔐 Creating environment files (.env.local, .env, .env.production)..."
            RAW_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
            RAW_BACKEND_URL="${{ secrets.BACKEND_URL }}"
            RAW_GOOGLE_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}"

            API_URL="${RAW_API_URL:-/api}"
            B_URL="${RAW_BACKEND_URL:-http://localhost:5000}"
            GOOGLE_ID="${RAW_GOOGLE_ID:-770218511201-eigo4o97m5gsqc0g1nshrs0aku4ehp1a.apps.googleusercontent.com}"

            cat > .env.local << EOF
            NEXT_PUBLIC_API_URL=${API_URL}
            BACKEND_URL=${B_URL}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_ID}
            EOF

            cp .env.local .env
            cp .env.local .env.production

            echo "📥 Installing production dependencies..."
            npm install --omit=dev

            echo "🚀 Restarting PM2..."

            pm2 describe frontend > /dev/null 2>&1 \
              && pm2 restart frontend --update-env \
              || pm2 start npm --name frontend -- start

            pm2 save

            echo "✅ Frontend deployment successful!"

            pm2 status