name: 🚀 Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Create environment file BEFORE build
      - name: Create .env.local
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          EOF

      # Install and build on GitHub Actions
      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      # Create deployment package
      - name: Create deployment archive
        run: |
          mkdir deploy

          cp -r .next deploy/
          cp -r public deploy/
          cp package.json deploy/
          cp package-lock.json deploy/

          if [ -f next.config.js ]; then
            cp next.config.js deploy/
          fi

          if [ -f next.config.ts ]; then
            cp next.config.ts deploy/
          fi

          cp .env.local deploy/

          cd deploy
          tar -czf ../frontend.tar.gz .

      # Upload to EC2
      - name: Upload frontend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true

      # Deploy
      - name: Deploy & Restart Frontend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            echo "📦 Extracting deployment..."
            tar -xzf frontend.tar.gz
            rm frontend.tar.gz

            echo "📥 Installing production dependencies..."
            npm install --omit=dev

            echo "🚀 Restarting PM2..."

            pm2 describe frontend > /dev/null 2>&1 \
              && pm2 restart frontend \
              || pm2 start npm --name frontend -- start

            pm2 save

            echo "✅ Frontend deployment successful!"

            pm2 status